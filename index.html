<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Around The U.S. is a travel website that showcases the beauty and diversity of the United States."
    />
    <meta name="keywords" content="travel, United States, tourism, adventure" />
    <meta name="author" content="Randy Delgado" />
    <link rel="stylesheet" href="./pages/index.css" />
    <link rel="icon" href="./favicon.ico" type="image/x-icon" />
    <title>Around The U.S.</title>
  </head>
  <body>
    <div class="page">
      <header class="header">
        <img
          src="./images/logo.svg"
          alt="Around The U.S. Logo"
          class="header__logo"
        />
      </header>
      <main class="main">
        <section class="profile">
          <img
            src="./images/avatar-me.jpg"
            alt="User Avatar"
            class="profile__avatar"
          />
          <div class="profile-info">
            <h2 class="profile-info__name">Jacques Cousteau</h2>
            <button class="edit-button edit-button_place_super">
              <img
                src="./images/edit-icon.svg"
                alt="Edit profile icon"
                class="edit-button__icon"
              />
            </button>
            <p class="profile-info__aboutMe">Explorador</p>
          </div>
          <button class="add-button">
            <img
              src="./images/add-icon.svg"
              alt="Add new profile icon"
              class="add-button__icon"
            />
          </button>
        </section>
        <section class="places">
          <ul class="places__cards"></ul>
        </section>
      </main>
      <footer class="footer">
        <p class="footer__copyright">&#169; 2025 Around The U.S.</p>
      </footer>
    </div>
    <template id="popup-template">
      <section class="popup">
        <div class="popup__content">
          <button type="button" class="popup__close">
            <img
              src="./images/close-icon.svg"
              alt="Icon button close"
              class="popup__close-icon"
            />
          </button>
          <div class="popup__container"></div>
        </div>
      </section>
    </template>
    <template id="form-profile-template">
      <form action="" class="form" novalidate>
        <h2 class="form__title">Editar perfil</h2>
        <div>
          <input
            type="text"
            value=""
            name="name"
            placeholder="Name"
            class="form__input"
            minlength="2"
            maxlength="40"
            required
          />
          <p id="name-error" class="form__error"></p>
        </div>
        <div>
          <input
            type="text"
            value=""
            name="aboutMe"
            placeholder="About me"
            class="form__input"
            minlength="2"
            maxlength="200"
            required
          />
          <p id="aboutMe-error" class="form__error"></p>
        </div>
        <button class="form__submit" type="submit">Save</button>
      </form>
    </template>
    <template id="card-template">
      <li class="card">
        <img src="" alt="" class="card__image" />
        <div class="card__info">
          <h2 class="card__title block"></h2>
          <button type="button" class="card__likes-button"></button>
          <button type="button" class="card__trash-button"></button>
        </div>
      </li>
    </template>
    <template id="form-place-template">
      <form action="" class="form" novalidate>
        <h2 class="form__title">New place</h2>
        <div>
          <input
            type="text"
            value=""
            name="name"
            placeholder="Title"
            class="form__input"
            minlength="2"
            maxlength="30"
            required
          />
          <p id="name-error" class="form__error"></p>
        </div>
        <div>
          <input
            type="url"
            value=""
            name="link"
            placeholder="Image URL"
            class="form__input"
            required
          />
          <p id="link-error" class="form__error"></p>
        </div>
        <button class="form__submit" type="submit">Save</button>
      </form>
    </template>
    <script src="./scripts/index.js"></script>
    <script src="./scripts/validate.js"></script>
  </body>
</html>
